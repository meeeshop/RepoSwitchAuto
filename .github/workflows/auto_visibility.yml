          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: python repo_switcher.py --repos seo --visibility public

  # ── SEO schema close (04:00) ───────────────────────────────────────────────
  seo-schema-close:
