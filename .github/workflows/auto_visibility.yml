          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Job | pinterest-night-close |" >> $GITHUB_STEP_SUMMARY
          echo "| Repos | pinterest |" >> $GITHUB_STEP_SUMMARY
          echo "| Target visibility | private (safe) |" >> $GITHUB_STEP_SUMMARY
          echo "| Time (UTC) | $TS |" >> $GITHUB_STEP_SUMMARY
          echo "| Result | $ICON $STATUS |" >> $GITHUB_STEP_SUMMARY

