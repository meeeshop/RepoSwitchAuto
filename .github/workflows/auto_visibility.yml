name: Auto Visibility (Scheduled)

# ─────────────────────────────────────────────────────────────────────────────
# Optimized open/close windows based on actual active workflows (verified 2026-06-14):
#
# Workflows schedule:
#   meeeshop-pinterest : 01:00 (video, analytics), 02:00 (posting), 02:30 (refresh),
#                        12:00 (video), 14:00 (posting), 14:30 (refresh),
#                        18:00 (posting), 18:30 (refresh),
#                        23:00 (posting), 23:30 (refresh)
#   meeeshop-seo       : 03:00 (schema), 04:00 (metafields), 05:00 (gmc), 06:00 (seo),
#                        07:00 (price update, linker), 08:00 (flipboard, weekly seo/price),
#                        12:00 (medium), 13:00 (blog), 13:30 (indexnow), 14:00 (blog, modify)
#   meeeshop-youtube   : 13:00 (shorts)
#
# Optimized Windows (open 1 hour before first job, close safely with --safe check):
#   1. Pinterest Night/Early Morning Block (covers 23:00 - 02:30 UTC jobs)
#      - Open:  22:00 UTC (cron: '0 22 * * *')
#      - Close: 03:00 UTC (cron: '0 3 * * *') -> pinterest PRIVATE --safe
#   2. SEO Morning Block (covers 03:00 - 08:00 UTC jobs)
#      - Open:  02:00 UTC (cron: '0 2 * * *')
#      - Close: 08:30 UTC (cron: '30 8 * * *') -> seo PRIVATE --safe
#   3. Midday/Afternoon Cluster (covers 12:00 - 14:30 UTC jobs across all 3 repos)
#      - Open:  11:00 UTC (cron: '0 11 * * *')
#      - Close: 15:00 UTC (cron: '0 15 * * *') -> pinterest+seo+youtube PRIVATE --safe
#   4. Pinterest Afternoon Block (covers 18:00 - 18:30 UTC jobs)
#      - Open:  17:00 UTC (cron: '0 17 * * *')
#      - Close: 19:00 UTC (cron: '0 19 * * *') -> pinterest PRIVATE --safe
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── Pinterest Night/Early Morning ──
    - cron: '0 22 * * *'       # 22:00 UTC → pinterest PUBLIC
    - cron: '0 3 * * *'        # 03:00 UTC → pinterest PRIVATE (safe)

    # ── SEO Morning ──
    - cron: '0 2 * * *'        # 02:00 UTC → seo PUBLIC
    - cron: '30 8 * * *'       # 08:30 UTC → seo PRIVATE (safe)

    # ── Midday/Afternoon Cluster ──
    - cron: '0 11 * * *'       # 11:00 UTC → pinterest, seo, youtube PUBLIC
    - cron: '0 15 * * *'       # 15:00 UTC → pinterest, seo, youtube PRIVATE (safe)

    # ── Pinterest Afternoon ──
    - cron: '0 17 * * *'       # 17:00 UTC → pinterest PUBLIC
    - cron: '0 19 * * *'       # 19:00 UTC → pinterest PRIVATE (safe)

  # Push to main keeps GitHub's scheduler warm (prevents cold-start skips)
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto_visibility.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Manual override'
        type: choice
        options:
          - auto-detect
          - make-public
          - make-private
        default: auto-detect

jobs:

  # ── Keepalive: runs on push to main only, keeps scheduler warm ────────────
  keepalive:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler keepalive ping
        run: |
          echo "Keepalive ping at $(date -u '+%Y-%m-%dT%H:%M:%SZ') — scheduler stays warm."
          echo "## Keepalive" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by push to main at $(date -u '+%Y-%m-%dT%H:%M:%SZ') UTC." >> $GITHUB_STEP_SUMMARY
          echo "No visibility changes applied. This run exists to keep GitHub's cron scheduler active." >> $GITHUB_STEP_SUMMARY

  # ── Pinterest Night Open (22:00) ───────────────────────────────────────────
  pinterest-night-open:
    if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: pinterest → public
        id: switcher
        if: github.event.schedule == '0 22 * * *' || github.event.inputs.action == 'make-public' || github.event.inputs.action == 'auto-detect'
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: python repo_switcher.py --repos pinterest --visibility public
      - name: Summary
        if: always()
        run: |
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          STATUS="${{ steps.switcher.outcome }}"
          if [ "$STATUS" = "success" ]; then ICON="✅"; elif [ "$STATUS" = "skipped" ]; then ICON="⏭️"; else ICON="❌"; fi
          echo "## Visibility Change Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Job | pinterest-night-open |" >> $GITHUB_STEP_SUMMARY
          echo "| Repos | pinterest |" >> $GITHUB_STEP_SUMMARY
          echo "| Target visibility | public |" >> $GITHUB_STEP_SUMMARY
          echo "| Time (UTC) | $TS |" >> $GITHUB_STEP_SUMMARY
          echo "| Result | $ICON $STATUS |" >> $GITHUB_STEP_SUMMARY

  # ── Pinterest Night Close (03:00 - Safe Polling) ───────────────────────────
