name: Auto Visibility (Scheduled)

# ─────────────────────────────────────────────────────────────────────────────
# Per-repo precise open/close windows. Each cron slot targets ONLY the repo(s)
# that actually have workflows scheduled at that time. ALL TIMES UTC.
#
# Source schedules (verified 2026-05-29):
#   REPO_PINTEREST : 01:00, 01:30, 12:00, 12:30, 17:00, 17:30, 21:00, 21:30
#   REPO_SEO       : 03:00(daily), 06:00(daily), 07:00(daily+Sun), 08:00(Sun),
#                    13:00(Tue/Thu), 14:00(Sat/Sun)
#   REPO_YOUTUBE   : 08:00(MWF blog_automation), 09:00(daily price_update),
#                    10:00(MWF blog-weekly), 13:00(daily YT shorts),
#                    14:00(daily video), 15:30(daily video)
#
# Window map (open 1hr before first job, close 1hr after last job):
#   00:00–02:30  pinterest only         (01:00 posting+video, 01:30 refresh)
#   02:00–04:00  seo only               (03:00 schema_validation daily)
#   05:00–08:30  seo only               (06:00 seo_daily, 07:00 price+linker, 08:00 Sun)
#   07:00–10:00  youtube MWF only       (08:00 blog_automation MWF)
#   08:00–10:30  youtube daily (non-MWF) (09:00 price_update daily — Tue/Thu/Sat/Sun/Mon)
#   10:00–12:30  youtube MWF extended   (10:00 blog-weekly MWF — window extended to 11:30)
#   11:00–16:30  pinterest+seo+youtube  (12:00–15:30 across all 3 repos)
#   16:00–18:30  pinterest only         (17:00 posting, 17:30 refresh)
#   20:00–22:30  pinterest only         (21:00 posting, 21:30 refresh)
#
# NOTE: youtube price_update runs DAILY at 09:00 UTC. On MWF it's covered by the
# 07:00 MWF open window. On other days (Tue/Thu/Sat/Sun) a dedicated daily open
# is needed at 08:00 (non-MWF) that closes at 10:30 after the job finishes.
# On MWF the MWF window stays open until 11:30 to cover blog-weekly at 10:00.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── Pinterest night: open ────────────────────────────────────────────────
    - cron: '0 0 * * *'        # 00:00 UTC → pinterest PUBLIC

    # ── Pinterest night: close ───────────────────────────────────────────────
    - cron: '30 2 * * *'       # 02:30 UTC → pinterest PRIVATE

    # ── SEO schema: open ─────────────────────────────────────────────────────
    - cron: '0 2 * * *'        # 02:00 UTC → seo PUBLIC

    # ── SEO schema: close ────────────────────────────────────────────────────
    - cron: '0 4 * * *'        # 04:00 UTC → seo PRIVATE

    # ── SEO daily: open ──────────────────────────────────────────────────────
    - cron: '0 5 * * *'        # 05:00 UTC → seo PUBLIC

    # ── SEO daily: close ─────────────────────────────────────────────────────
    - cron: '30 8 * * *'       # 08:30 UTC → seo PRIVATE

    # ── YouTube MWF morning: open ────────────────────────────────────────────
    - cron: '0 7 * * 1,3,5'    # 07:00 UTC MWF → youtube PUBLIC (covers 08:00 blog_automation)

    # ── YouTube MWF morning: close (extended past 10:00 blog-weekly) ─────────
    - cron: '30 11 * * 1,3,5'  # 11:30 UTC MWF → youtube PRIVATE (after 10:00 blog-weekly finishes)

    # ── YouTube daily price_update (non-MWF): open ───────────────────────────
    - cron: '0 8 * * 0,2,4,6'  # 08:00 UTC Sun/Tue/Thu/Sat → youtube PUBLIC (covers 09:00 price_update)

    # ── YouTube daily price_update (non-MWF): close ──────────────────────────
    - cron: '30 10 * * 0,2,4,6' # 10:30 UTC Sun/Tue/Thu/Sat → youtube PRIVATE

    # ── Midday/afternoon cluster: open ───────────────────────────────────────
    - cron: '0 11 * * *'       # 11:00 UTC → pinterest+seo+youtube PUBLIC

    # ── Midday/afternoon cluster: close ──────────────────────────────────────
    - cron: '30 16 * * *'      # 16:30 UTC → pinterest+seo+youtube PRIVATE

    # ── Pinterest afternoon: open ────────────────────────────────────────────
    - cron: '0 16 * * *'       # 16:00 UTC → pinterest PUBLIC

    # ── Pinterest afternoon: close ───────────────────────────────────────────
    - cron: '30 18 * * *'      # 18:30 UTC → pinterest PRIVATE

    # ── Pinterest evening: open ──────────────────────────────────────────────
    - cron: '0 20 * * *'       # 20:00 UTC → pinterest PUBLIC

    # ── Pinterest evening: close ─────────────────────────────────────────────
    - cron: '30 22 * * *'      # 22:30 UTC → pinterest PRIVATE

  workflow_dispatch:
    inputs:
      action:
        description: 'Manual override'
        type: choice
        options:
          - auto-detect
          - make-public
          - make-private
        default: auto-detect

# ─────────────────────────────────────────────────────────────────────────────
# Each job is hardcoded to its exact repo(s) and visibility.
# Jobs only run when their cron fires — GitHub skips jobs whose cron didn't
# trigger them (using github.event.schedule matching).
# workflow_dispatch runs ALL jobs with the chosen action for full manual control.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Pinterest night open (00:00) ───────────────────────────────────────────
  pinterest-night-open:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: pinterest → public
        if: github.event.schedule == '0 0 * * *' || github.event.inputs.action == 'make-public' || github.event.inputs.action == 'auto-detect'
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: python repo_switcher.py --repos pinterest --visibility public

  # ── Pinterest night close (02:30) ──────────────────────────────────────────
  pinterest-night-close:
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: pinterest → private
        if: github.event.schedule == '30 2 * * *' || github.event.inputs.action == 'make-private'
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: python repo_switcher.py --repos pinterest --visibility private

  # ── SEO schema open (02:00) ────────────────────────────────────────────────
  seo-schema-open:
